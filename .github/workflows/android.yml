name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest testSpikeUnitTest testSweepUnitTest testSweepRadioUnitTest lintSweep lintSweepRadio --stacktrace

      - name: Spike evidence tests
        run: python3 -m unittest discover -s spike/tests -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/tests/testSpikeUnitTest/
            app/build/reports/tests/testSweepUnitTest/
            app/build/reports/tests/testSweepRadioUnitTest/
          if-no-files-found: ignore

  build:
    name: APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug assembleSpike assembleSweep assembleSweepRadio --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fieldwatch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload SWEEP spike APK
        uses: actions/upload-artifact@v4
        with:
          name: sweep-spike-apk
          path: app/build/outputs/apk/spike/app-spike.apk
          if-no-files-found: error

      - name: Verify SWEEP has no network permission
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/sweep/app-sweep.apk > sweep-permissions.txt
          python3 -c "from pathlib import Path; assert 'android.permission.INTERNET' not in Path('sweep-permissions.txt').read_text()"

      - name: Upload SWEEP alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: sweep-alpha-apk
          path: app/build/outputs/apk/sweep/app-sweep.apk
          if-no-files-found: error

      - name: Verify optional radio permissions
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/sweepRadio/app-sweepRadio.apk > sweep-radio-permissions.txt
          python3 -c "from pathlib import Path; p=Path('sweep-radio-permissions.txt').read_text(); assert 'android.permission.INTERNET' in p; assert 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' in p"

      - name: Upload SWEEP with radio APK
        uses: actions/upload-artifact@v4
        with:
          name: sweep-radio-alpha-apk
          path: app/build/outputs/apk/sweepRadio/app-sweepRadio.apk
          if-no-files-found: error
